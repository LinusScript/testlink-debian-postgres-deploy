name: Docs-Check

on:
  push:
    paths:
      - "**/*.md"
      - "scripts/check-links.py"
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-links.py"

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Interne Markdown-Links pruefen
        run: python3 scripts/check-links.py
